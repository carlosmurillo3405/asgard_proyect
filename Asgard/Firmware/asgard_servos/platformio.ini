; Firmware de la placa que controla los servos de Asgard (pan, tilt y mano).
;
;   pio run -t upload               compila y carga en un Arduino Uno (placa predeterminada)
;   pio run -e nano -t upload       Arduino Nano (cargador nuevo; con el viejo usa -e nano-old)
;   pio run -e esp32dev -t upload   también funciona en un ESP32 (esp32-s3, esp32-c3)
;   pio device monitor              monitor serie para probar las órdenes a mano
;
; En VS Code, con la extensión PlatformIO IDE, abre esta carpeta y usa los
; botones de la barra inferior (compilar, subir, monitor).

[platformio]
default_envs = uno

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
build_src_flags = -Wall -Wextra

; --- Arduino (ATmega328P) -----------------------------------------------------
[avr]
platform = atmelavr @ 5.1.0

[env:uno]
extends = avr
board = uno

[env:nano]
extends = avr
board = nanoatmega328new

[env:nano-old]
extends = avr
board = nanoatmega328

; --- ESP32 (alternativa) --------------------------------------------------------
[esp32]
platform = espressif32 @ 6.10.0
upload_speed = 921600
monitor_filters = send_on_enter, esp32_exception_decoder

[env:esp32dev]
extends = esp32
board = esp32dev

[env:esp32-s3]
extends = esp32
board = esp32-s3-devkitc-1

[env:esp32-c3]
extends = esp32
board = esp32-c3-devkitm-1
