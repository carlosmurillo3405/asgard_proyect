; Firmware del ESP32 que controla los servos de Asgard (pan, tilt y mano).
;
;   pio run -t upload               compila y carga en un ESP32 clásico (DevKit)
;   pio run -e esp32-s3 -t upload   otras placas: esp32-s3, esp32-c3
;   pio device monitor              monitor serie para probar las órdenes a mano
;
; En VS Code, con la extensión PlatformIO IDE, abre esta carpeta y usa los
; botones de la barra inferior (compilar, subir, monitor).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 6.10.0
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter, esp32_exception_decoder
build_src_flags = -Wall -Wextra

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
