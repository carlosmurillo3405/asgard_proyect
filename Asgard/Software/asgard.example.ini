; =============================================================================
; Configuración de Asgard
; Copia este archivo como asgard.ini (el instalador lo hace por ti).
; Valores sí/no: yes, no. Los comentarios empiezan con ';'.
; =============================================================================

[bifrost]
server = auto                ; IP o dominio de Bifröst; "auto" lo busca en la red local
port = 8765                  ; puerto TCP de Bifröst
tls = no                     ; yes = conexión cifrada (obligatorio con Bifröst en modo público)
tls_fingerprint =            ; huella SHA-256 del certificado (main.py fingerprint en Bifröst)
tls_ca =                     ; o bien: archivo de CA/certificado de Bifröst
tls_insecure = no            ; yes = no validar el certificado (solo pruebas)
device =                     ; identificador registrado: main.py asgard register <id>
secret =                     ; secreto que mostró Bifröst al registrar el Asgard

[video]
; Asgard siempre emite en esta calidad (Midgard no puede bajarla).
camera = 0                   ; índice de cámara USB (0, 1...), picamera2 o simulation
width = 1920
height = 1080
fps = 30
jpeg_quality = 90            ; 1-100
field_of_view = 62           ; campo de visión horizontal de la cámara (grados)
rotation = 0                 ; 0, 90, 180 o 270 si la cámara está montada girada
mirror = no

[audio]
; El audio siempre viaja en máxima calidad: PCM 48 kHz, 16 bits, estéreo si el micrófono lo permite.
enabled = yes
input =                      ; micrófono: vacío = predeterminado, índice o parte del nombre
output =                     ; altavoz: vacío = predeterminado, índice o parte del nombre
channels = 2                 ; 1 mono o 2 estéreo
jitter_ms = 40               ; colchón de red inicial (crece solo si hay cortes)
transport = auto             ; auto = UDP con respaldo TCP; tcp = solo TCP
latency = low                ; low o high (usa high si el audio se entrecorta en la Pi)
hand_sound = yes             ; tono al levantar la mano
chat_sound = yes             ; tono al recibir un mensaje

[servos]
driver = gpiozero            ; arduino (Arduino Uno por USB, recomendado), esp32, pca9685 (I2C), gpiozero (GPIO directo) o sim
pan_pin = 17                 ; GPIO del servo horizontal (gpiozero)
tilt_pin = 27                ; GPIO del servo vertical (gpiozero)
pan_channel = 0              ; canal del pan (Arduino: 0 = D9; PCA9685 o ESP32)
tilt_channel = 1             ; canal del tilt (Arduino: 1 = D10; PCA9685 o ESP32)
serial_port = auto           ; Arduino/ESP32: auto, /dev/ttyACM0 o /dev/ttyUSB0 (USB), /dev/serial0 (UART de los GPIO)
pan_min = 10
pan_max = 170
tilt_min = 40
tilt_max = 140
rest_pan = 90                ; posición al terminar una sesión
rest_tilt = 90
min_pulse_us = 500           ; pulso del servo a 0°
max_pulse_us = 2400          ; pulso del servo a 180°
max_speed = 90               ; grados por segundo
invert_pan = no
invert_tilt = no
release_when_idle = yes      ; deja de enviar pulsos en reposo (evita temblor)

[hand]
type = servo                 ; servo, gpio (relé/solenoide), sim o none
driver =                     ; vacío = el mismo de [servos]; arduino, esp32, pca9685, gpiozero o sim
pin = 22                     ; GPIO del servo o de la salida digital
channel = 2                  ; canal (Arduino: 2 = D3; PCA9685 o ESP32)
rest_angle = 0
raised_angle = 150
auto_lower_s = 0             ; 0 = queda levantada hasta que Midgard la baje
active_high = yes            ; solo para type = gpio

[ai]
enabled = yes
model = full                 ; lite (rápido), full (equilibrado), heavy (preciso) o ruta a .task
max_people = 3
min_confidence = 0.5
min_visibility = 0.35
analysis_width = 640         ; la IA analiza una copia reducida (más rápido)
max_hz = 15                  ; detecciones por segundo como máximo
aim_y = 0.35                 ; altura del cuerpo a centrar (0 = cabeza, 0.5 = torso)

[screen]
mode = fullscreen            ; fullscreen, window o none (sin monitor)
chat_font_size = 20          ; tamaño de letra de los mensajes
diagnostics = no             ; yes = línea de diagnóstico (cámara, servos, IA) al pie de la pantalla
language = auto              ; idioma de la pantalla y los mensajes: auto (el del sistema), en o es
