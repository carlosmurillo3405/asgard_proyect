# Cancelación de eco para Asgard (PipeWire, experimental).
# Evita que Midgard escuche su propia voz cuando el altavoz del aula la reproduce
# y el micrófono de Asgard la vuelve a captar.
#
# Se instala con: ./install.sh --echo-cancel
# (copia este archivo en ~/.config/pipewire/pipewire.conf.d/).
#
# Crea un micrófono y un altavoz virtuales "sin eco". Si WirePlumber no los
# elige solos como predeterminados, ejecútalo a mano:
#     wpctl status                 # busca "Asgard microphone (echo cancelled)" y "Asgard speaker (echo cancelled)"
#     wpctl set-default <ID>       # una vez para cada uno
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            capture.props = {
                node.name    = "asgard.echo.capture"
                node.passive = true
            }
            source.props = {
                node.name        = "asgard_microphone_echo_cancelled"
                node.description = "Asgard microphone (echo cancelled)"
                priority.session = 2000
            }
            sink.props = {
                node.name        = "asgard_speaker_echo_cancelled"
                node.description = "Asgard speaker (echo cancelled)"
                priority.session = 2000
            }
            playback.props = {
                node.name    = "asgard.echo.playback"
                node.passive = true
            }
        }
    }
]
